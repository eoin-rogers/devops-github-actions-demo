name: Building the main.c file using make
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone is the git repo
        uses: actions/checkout@v7
      - name: Display what is in the repo before the build
        run: ls
      - name: Run the build
        run: make -j$(nproc)
      - name: Display what is in the repo after the build
        run: ls
      - name: Upload the finished program so we can download it
        uses: actions/upload-artifact@v7
        with:
          name: main
          path: ./main
